<!DOCTYPE html>
<html lang="en">
<head><script src="coi-serviceworker.min.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rogue Legacy — WebAssembly</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="alternate icon" href="favicon.ico" />

  <style>
    /* -----------------------------------------------------------------------
       Dark background; centre the 1280×720 canvas and scale it to fit the
       viewport while preserving the pixel-art aspect ratio.
    ----------------------------------------------------------------------- */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      background: #0a0a0a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: monospace;
      color: #ccc;
    }

    #canvas-wrapper {
      position: relative;
      width: min(100vw, calc(100vh * 1320 / 720));
      aspect-ratio: 1320 / 720;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      /* Prevent context menu / text selection on right-click / long-press */
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    #loading-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.85);
      z-index: 10;
      transition: opacity 0.5s;
    }

    #loading-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    #loading-box {
      text-align: center;
      padding: 2rem;
    }

    #loading-box h1 {
      font-size: 1.6rem;
      margin-bottom: 1rem;
      letter-spacing: 0.15em;
      color: #e8c86a;
      text-shadow: 0 0 12px #a07820;
    }

    #loading-progress {
      font-size: 0.85rem;
      color: #999;
      min-height: 1.2em;
    }

    .spinner {
      width: 3rem; height: 3rem;
      border: 4px solid #333;
      border-top-color: #e8c86a;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 1rem auto;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    #fps-counter {
      position: absolute;
      top: 10px;
      right: 12px;
      background: rgba(0, 0, 0, 0.7);
      color: #4ade80;
      font-family: monospace, Consolas, Courier, sans-serif;
      font-size: 13px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 4px;
      border: 1px solid rgba(74, 222, 128, 0.35);
      pointer-events: none;
      z-index: 5;
      letter-spacing: 0.5px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.6);
      user-select: none;
      -webkit-user-select: none;
      transition: color 0.2s, border-color 0.2s;
    }
  </style>
</head>
<body>

  <div id="canvas-wrapper">
    <!-- The game renders into this canvas.  FNA/SDL maps its window here. -->
    <canvas id="canvas" tabindex="0" oncontextmenu="return false;"></canvas>

    <!-- Real-time FPS counter overlay -->
    <div id="fps-counter">-- FPS</div>

    <!-- Loading overlay — hidden once the runtime calls boot() -->
    <div id="loading-overlay">
      <div id="loading-box">
        <h1>ROGUE LEGACY</h1>
        <div class="spinner"></div>
        <p id="loading-progress">Initialising…</p>
        <p id="loading-warning" style="margin-top: 1.2rem; font-size: 0.75rem; color: #888; max-width: 320px; line-height: 1.4;">
          Note: The intro & tutorial may experience momentary frame drops, and the game may briefly pause while generating procedural levels. Once in the castle, gameplay runs smoothly!
        </p>
      </div>
    </div>
  </div>

  <!--
    main.js is the bootstrap module.  It imports _framework/dotnet.js which is
    emitted by `dotnet publish -r browser-wasm` and mounts the virtual filesystem
    before starting the .NET runtime.

    type="module" is required for top-level await / dynamic import() inside main.js.
  -->
  <script type="module" src="main.js"></script>

  <script>
    // Hide the loading overlay once the first frame is actively rendered by FNA/WebGL.
    const overlay = document.getElementById("loading-overlay");

    let _hideTimer = setInterval(() => {
      if (window._gameReady) {
        clearInterval(_hideTimer);
        overlay.classList.add("hidden");
      }
    }, 100);

    // Fallback safeguard: after 90 seconds, hide overlay if still up
    setTimeout(() => {
      if (overlay && !overlay.classList.contains("hidden")) {
        console.warn("[RogueLegacy] Fallback hide timer triggered.");
        overlay.classList.add("hidden");
      }
    }, 90000);
  </script>

</body>
</html>
