<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="helm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="40%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="plume" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="60%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Shield Badge -->
  <rect width="64" height="64" rx="14" fill="#0f1117"/>
  <rect x="2" y="2" width="60" height="60" rx="12" fill="none" stroke="url(#gold)" stroke-width="2.5" opacity="0.9"/>

  <!-- Helmet Plume / Feather Crest -->
  <path d="M 32 6 C 26 6 22 10 24 16 C 27 12 33 11 42 12 C 45 12 47 13 49 15 C 47 11 41 6 32 6 Z" fill="url(#plume)"/>
  <path d="M 34 11 C 38 11 44 13 46 16 C 41 14 36 14 31 16 C 30 14 32 11 34 11 Z" fill="#fca5a5" opacity="0.6"/>

  <!-- Helmet Dome -->
  <path d="M 20 26 C 20 17 25 14 32 14 C 39 14 44 17 44 26 L 45 38 C 45 42 42 46 38 48 L 32 50 L 26 48 C 22 46 19 42 19 38 Z" fill="url(#helm)"/>

  <!-- Crown / Forehead Trim -->
  <path d="M 19 25 L 26 27 L 32 23 L 38 27 L 45 25 L 44 29 L 38 31 L 32 28 L 26 31 L 20 29 Z" fill="url(#gold)"/>

  <!-- Visor Slit (Dark T-Shape) -->
  <rect x="23" y="32" width="18" height="5" rx="1.5" fill="#05070a"/>
  <rect x="30" y="32" width="4" height="13" rx="1" fill="#05070a"/>

  <!-- Glowing Yellow Eyes Behind Visor -->
  <circle cx="27" cy="34.5" r="1.6" fill="#fef08a" filter="url(#glow)"/>
  <circle cx="37" cy="34.5" r="1.6" fill="#fef08a" filter="url(#glow)"/>

  <!-- Helmet Jaw / Guard Lines -->
  <line x1="26" y1="41" x2="28" y2="45" stroke="#334155" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="38" y1="41" x2="36" y2="45" stroke="#334155" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Helmet Highlight -->
  <path d="M 23 20 C 25 17 29 16 32 16" stroke="#f8fafc" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.7"/>
</svg>
